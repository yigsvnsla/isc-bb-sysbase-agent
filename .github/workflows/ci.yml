name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/bom.json
          if-no-files-found: warn

  security:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .container/containerfile
          push: false
          load: true
          tags: sysbase-agent:ci

      - name: Trivy image scan (HIGH/CRITICAL gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sysbase-agent:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # Suites pesadas/lentas (imágenes multi-motor ~1.5GB, test de carga) que no
  # deben bloquear cada PR: corren solo nightly o a pedido (workflow_dispatch).
  nightly-extended:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Multi-engine dialect tests (MSSQL / Oracle / Sybase)
        env:
          RUN_MULTIDB_TESTS: 'true'
        run: ./mvnw -B -ntp test -Dtest=MultiDbDialectE2ETest -DexcludedGroups=

      - name: Load test
        run: ./mvnw -B -ntp test -Dtest=LoadE2ETest -DexcludedGroups=
