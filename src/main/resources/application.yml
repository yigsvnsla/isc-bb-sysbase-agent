spring:
    application:
        name: sysbase-agent
    config:
        import: "optional:file:.env[.properties]"
    sql:
        init:
            mode: always
    datasource:
        url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
        username: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
    ai:
        model:
            chat: openai
            embedding: transformers
        openai:
            api-key: ${IA_API_KEY}
            base-url: ${IA_API_BASE_URL}
            chat:
                model: ${IA_API_MODEL}
                temperature: ${IA_API_TEMPERATURE} 
                max-tokens: ${IA_API_MAX_TOKEN}
                # ── Thinking mode (razonamiento) ──
                # Descomentar para activar:
                # options:
                #     - chat_template_kwargs.thinking: true
                #     - chat_template_kwargs.reasoning_effort: high
            options:
                connect-timeout: 30s
                read-timeout: 120s
        vectorstore:
            pgvector:
                index-type: HNSW
                dimensions: 384
                initialize-schema: true
        embedding:
            transformer:
                cache:
                    directory: ${ONNX_CACHE_DIR:.container/onnx-cache}
                tokenizer:
                    options:
                        padding: true


    cache:
        type: redis
        redis:
            time-to-live: 10m
            cache-null-values: false
        cache-names: sp_source, sp_search

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            timeout: 2s
            lettuce:
                pool:
                    max-active: 8
                    max-idle: 4
                    min-idle: 2

app:
    knowledge-base:
        pdf-dir: ${KNOWLEDGE_BASE_PDF_DIR:classpath:static/documents}
    ai:
        stream-fix-id: true
        agent:
            max-tool-calls-per-turn: ${MAX_TOOL_CALLS_PER_TURN:5}
        budget:
            enabled: true
            requests-per-day: 500
            chars-per-day: 400000
            msgs-per-conversation: 100
        router:
            enabled: true
            cheap-model: ${IA_API_MODEL_CHEAP:deepseek-v4-flash}
            expensive-model: ${IA_API_MODEL_EXPENSIVE:deepseek-v4-pro}
            fallback-tier: cheap
            score-threshold: 0.6
            gray-low: 0.35
            gray-high: 0.55
            classifier:
                enabled: true
                model: ${IA_API_MODEL_CHEAP:deepseek-v4-flash}
                timeout-ms: 1500
                max-tokens: 8
            cache:
                enabled: true
                ttl-min: 60
    security:
        jwt:
            secret: ${JWT_SECRET:dev-only-secret-cambiar-en-produccion-32bytes}
            previous-secret: ${JWT_PREVIOUS_SECRET:}
            ttl-minutes: ${JWT_TTL_MINUTES:60}
        oidc:
            issuer-uri: ${OIDC_ISSUER_URI:}
        cors-origins: ${CORS_ORIGINS:http://localhost:3000}
        rate-limit:
            enabled: true
            user-per-minute: 60
            ip-per-minute: 20
        # TODO(futuro): definir dominios reales de producción y fijar allowlist estricta.
        # TODO(futuro): scopes finos por API key (no solo roles).
    databases:
        default-engine: postgres
        # Conexiones multi-motor (F1). El nombre "postgres" (reservado) usa el
        # DataSource primario. Ejemplo:
        # connections:
        #   mssql-qa:
        #     engine: mssql
        #     url: jdbc:sqlserver://localhost:1433;databaseName=mi_db;encrypt=false
        #     username: sa
        #     password: changeme
        #   oracle-prod:
        #     engine: oracle
        #     url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
        #     username: system
        #     password: changeme
    docs:
        active-publisher: docusaurus
        auto-index:
            enabled: true
            interval-ms: 300000
            run-on-startup: true
            force: false
        docusaurus:
            path: ${DOCS_DOCUSAURUS_PATH:.container/docs}
            site-path: ${DOCS_DOCUSAURUS_SITE_PATH:.container/docusaurus}
    audit:
        retention-days: 90
        purge-cron: "0 0 3 * * *"
        worm:
            enabled: ${WORM_ENABLED:true}
            dir: ${WORM_DIR:data/worm}
            cron: "0 0 2 * * *"
            batch-size: 500
            hmac-secret: ${WORM_HMAC_SECRET:dev-only-worm-hmac-secret-cambiar-en-produccion-32b}

logging:
    level:
        com.isc.bb.sysbase_agent: DEBUG
        org.springframework.ai: DEBUG
        org.springframework.jdbc: DEBUG

server:
    port: ${PORT:8080}
    servlet:
        context-path: /api

management:
    tracing:
        sampling:
            probability: 1.0
        # TODO(futuro): sampling 0.1 en producción (ver application-prod.yml).
    endpoints:
        web:
            exposure:
                include: health,prometheus
    otlp:
        tracing:
            endpoint: ${OTEL_EXPORTER_ENDPOINT:}