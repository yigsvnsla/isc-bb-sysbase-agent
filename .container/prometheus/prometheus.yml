global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  - job_name: sysbase-agent
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ["localhost:8080"]
